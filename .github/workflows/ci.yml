name: MediFlow CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore Dependencies
      run: dotnet restore MediFlow.sln

    - name: Build Solution
      run: dotnet build MediFlow.sln --configuration Release --no-restore

    - name: Run xUnit Unit & Integration Tests
      run: dotnet test MediFlow.sln --configuration Release --no-build --verbosity normal
